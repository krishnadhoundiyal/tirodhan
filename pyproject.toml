[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tirodhan-backend"
version = "0.1.0"
description = "Transactional backend for the Tirodhan collection platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "azure-identity>=1.15,<2",
    "azure-servicebus>=7.14,<8",
    "azure-storage-blob[aio]>=12.19,<13",
    "cryptography>=46,<51",
    "fastapi>=0.115,<1",
    "firebase-admin>=7.3,<8",
    "geoalchemy2[shapely]>=0.16,<1",
    "httpx>=0.27,<1",
    "h3>=4.5,<5",
    "pydantic-settings>=2.7,<3",
    "PyJWT[crypto]>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34,<1",
    "uuid6>=2024.7.10,<2027",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "python-hcl2>=7,<8",
    "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires a disposable PostgreSQL/PostGIS database",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["tirodhan"]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true
