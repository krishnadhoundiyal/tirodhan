name: Trusted NONPROD Terraform setup
description: OIDC and Entra-only backend; call only on protected main/environment jobs.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.13.5
        terraform_wrapper: false
    - uses: azure/login@v2
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
    - shell: bash
      run: |
        set -euo pipefail
        python -m pip install -e '.[dev]'
        python -m tirodhan.deployment.azure_controls
        cd infra/terraform/nonprod
        python -m tirodhan.deployment.inputs
        terraform init -input=false -lockfile=readonly \
          -backend-config="storage_account_name=$STATE_ACCOUNT_NAME" \
          -backend-config="container_name=tfstate" \
          -backend-config="resource_group_name=$STATE_RESOURCE_GROUP"
        terraform validate
