name: Trusted NONPROD Terraform setup
description: OIDC and Entra-only backend; call only on protected main/environment jobs.
inputs:
  mode:
    description: Provisioning admission or independent protected teardown
    default: provisioning
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.13.5
        terraform_wrapper: false
    - uses: azure/login@v2
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
    - shell: bash
      env:
        BACKEND_SETUP_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        python -m pip install -e '.[dev]'
        python -m tirodhan.deployment.azure_controls
        cd infra/terraform/nonprod
        python -m tirodhan.deployment.inputs
        python -m tirodhan.deployment.backend_setup "$BACKEND_SETUP_MODE"
        terraform validate
