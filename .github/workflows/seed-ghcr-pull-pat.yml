name: Seed NONPROD GHCR pull PAT
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: nonprod-ghcr-pat-seed
  cancel-in-progress: false
jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    environment: nonprod
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_SCOPE: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.NONPROD_RESOURCE_GROUP }}
      KEY_VAULT_URL: ${{ vars.NONPROD_KEY_VAULT_URL }}
      GHCR_PULL_PAT: ${{ secrets.NONPROD_GHCR_PULL_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python -m pip install -e .
      - run: python -m tirodhan.deployment.azure_controls
      - run: python -m tirodhan.deployment.seed_ghcr_pull_pat
