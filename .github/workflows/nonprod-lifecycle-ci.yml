name: NONPROD lifecycle safety checks

on:
  pull_request:
    paths:
      - '.github/workflows/nonprod-*.yml'
      - 'deploy/bootstrap/bootstrap.sh'
      - 'src/tirodhan/deployment/foundation_*.py'
      - 'src/tirodhan/deployment/check_destroy_plan.py'
      - 'infra/terraform/nonprod/**'
      - 'tests/unit/test_foundation_*.py'
      - 'tests/unit/test_nonprod_destroy_workflow.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Check static quality
        run: |
          ruff check src/tirodhan/deployment/foundation_reconcile.py src/tirodhan/deployment/foundation_lifecycle.py tests/unit/test_foundation_reconcile.py tests/unit/test_foundation_lifecycle.py
          ruff format --check src/tirodhan/deployment/foundation_reconcile.py src/tirodhan/deployment/foundation_lifecycle.py tests/unit/test_foundation_reconcile.py tests/unit/test_foundation_lifecycle.py
          mypy
          bash -n deploy/bootstrap/bootstrap.sh
      - name: Run isolated lifecycle checks
        run: |
          pytest -q tests/unit/test_foundation_reconcile.py tests/unit/test_foundation_lifecycle.py tests/unit/test_nonprod_destroy_workflow.py
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Validate Terraform configuration (no Azure auth)
        working-directory: infra/terraform/nonprod
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
