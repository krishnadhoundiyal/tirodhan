name: Routing Adversarial QA
on:
  pull_request:
    paths:
      - 'tests/routing_qa/**'
      - 'src/tirodhan/modules/planning/routing/**'
      - '.github/workflows/routing-qa.yml'
jobs:
  adversarial_testing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tirodhan
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: tirodhan_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      vroom:
        image: ghcr.io/vroom-project/vroom-docker:v1.15.0
        ports:
          - "3000:3000"
        env:
          VROOM_ROUTER: osrm
    env:
      TIRODHAN_TEST_DATABASE_URL: postgresql+asyncpg://tirodhan:disposable-test-only@localhost:5432/tirodhan_test
      TIRODHAN_ROUTING_ENGINE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' hypothesis pytest
      - run: python -m pip install ortools==9.14.6206
      - name: Setup OSRM profiles and graph
        run: |
          mkdir -p /tmp/osrm-data/car
          cp tests/routing/data/delhi-road.osm.pbf /tmp/osrm-data/car/map.osm.pbf
          docker run --rm -v /tmp/osrm-data:/data ghcr.io/project-osrm/osrm-backend@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564 sh -ec 'osrm-extract -p /opt/car.lua /data/car/map.osm.pbf && osrm-partition /data/car/map.osrm && osrm-customize /data/car/map.osrm'
          docker run -d -p 5000:5000 -v /tmp/osrm-data/car:/data ghcr.io/project-osrm/osrm-backend@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564 osrm-routed --algorithm mld /data/map.osrm
          sleep 5
      - name: Execute Adversarial Tests
        run: python -m pytest tests/routing_qa/ -v --hypothesis-show-statistics
      - name: Execute Base Suite
        run: python -m pytest tests/routing/ -v
