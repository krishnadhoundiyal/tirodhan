name: NONPROD authorized lifecycle reconciliation
run-name: NONPROD ${{ inputs.operation }} ${{ inputs.authorization_id }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options:
          - recover-vault
          - plan-transfer
          - transfer-vault
          - initialize-state-plan
          - initialize-state-apply
          - prepare-compensation
          - compensate-foundation
      authorization_id:
        type: string
        required: true
      artifact_run_id:
        description: Reviewed plan/backup artifact source, required for apply operations
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: nonprod-release
  cancel-in-progress: false
env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'
  NONPROD_RESOURCE_GROUP: ${{ vars.NONPROD_RESOURCE_GROUP }}
  STATE_ACCOUNT_NAME: ${{ vars.NONPROD_STATE_ACCOUNT }}
  STATE_RESOURCE_GROUP: ${{ vars.NONPROD_STATE_RESOURCE_GROUP }}
  NONPROD_TFVARS_JSON: ${{ vars.NONPROD_TFVARS_JSON }}
  AZURE_NONPROD_RECOVERY_CLIENT_ID: ${{ vars.AZURE_NONPROD_RECOVERY_CLIENT_ID }}
  AZURE_NONPROD_RECOVERY_PRINCIPAL_ID: ${{ vars.AZURE_NONPROD_RECOVERY_PRINCIPAL_ID }}
  AZURE_NONPROD_DATABASE_VERIFY_CLIENT_ID: ${{ vars.AZURE_NONPROD_DATABASE_VERIFY_CLIENT_ID }}
  AZURE_NONPROD_DATABASE_VERIFY_PRINCIPAL_ID: ${{ vars.AZURE_NONPROD_DATABASE_VERIFY_PRINCIPAL_ID }}
  DEPLOYMENT_SCOPE: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.NONPROD_RESOURCE_GROUP }}
  TIRODHAN_OPERATOR_RUN_ID: ${{ inputs.authorization_id }}
  TIRODHAN_NONPROD_RELEASE_AUTHORIZATION: ${{ secrets.NONPROD_RELEASE_AUTHORIZATION }}
  TIRODHAN_NONPROD_OPERATION: ${{ inputs.operation == 'plan-transfer' && 'state-backup' || inputs.operation }}
  GH_TOKEN: ${{ github.token }}
jobs:
  release-admission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce release admission before Azure authentication
        run: |
          python -m pip install -e .
          python -m tirodhan.deployment.deployment_admission
  reconcile:
    # Bound recovery without shortening existing transfer/compensation operations.
    timeout-minutes: ${{ inputs.operation == 'recover-vault' && 15 || 360 }}
    needs: release-admission
    if: github.ref == 'refs/heads/main'
    environment:
      name: ${{ inputs.operation == 'recover-vault' && 'nonprod-recovery' || inputs.operation == 'initialize-state-plan' && 'nonprod-plan' || 'nonprod' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TIRODHAN_EXECUTION_ENVIRONMENT: ${{ inputs.operation == 'recover-vault' && 'nonprod-recovery' || inputs.operation == 'initialize-state-plan' && 'nonprod-plan' || 'nonprod' }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ inputs.operation == 'recover-vault' && vars.AZURE_NONPROD_RECOVERY_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare exact approved configuration
        run: |
          set -euo pipefail
          python -m pip install -e .
          cd infra/terraform/nonprod
          python -m tirodhan.deployment.inputs
          if [[ "$REQUESTED_OPERATION" != recover-vault && "$REQUESTED_OPERATION" != initialize-state-* ]]; then
            python -m tirodhan.deployment.azure_controls
            python -m tirodhan.deployment.backend_setup provisioning
          fi
      - uses: actions/download-artifact@v4
        if: inputs.artifact_run_id != ''
        with:
          name: nonprod-lifecycle-plan
          path: infra/terraform/nonprod
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Execute only the explicitly authorized lifecycle operation
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail
          case "$REQUESTED_OPERATION" in
            recover-vault|plan-transfer|transfer-vault)
              python -m tirodhan.deployment.foundation_reconcile "$REQUESTED_OPERATION" ;;
            initialize-state-plan|initialize-state-apply)
              python -m tirodhan.deployment.foundation_lifecycle "$REQUESTED_OPERATION" --plan initialization-intent.json ;;
            prepare-compensation|compensate-foundation)
              python -m tirodhan.deployment.foundation_lifecycle "$REQUESTED_OPERATION" --plan compensation.tfplan ;;
            *) echo 'Unknown lifecycle operation; no mutation authorized.' >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonprod-lifecycle-plan
          path: |
            infra/terraform/nonprod/vault-transfer.tfplan
            infra/terraform/nonprod/vault-transfer-backup.json
            infra/terraform/nonprod/initialization-intent.json
            infra/terraform/nonprod/compensation.tfplan
          retention-days: 1
