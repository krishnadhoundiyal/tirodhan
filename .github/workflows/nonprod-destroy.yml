name: Destroy NONPROD

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY_NONPROD exactly
        required: true
        type: string
      expected_suffix:
        description: NONPROD suffix expected in the current Terraform input
        required: true
        default: tdnp01
        type: string

permissions:
  contents: read

concurrency:
  group: nonprod-release
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'

  STATE_ACCOUNT_NAME: ${{ vars.NONPROD_STATE_ACCOUNT }}
  STATE_RESOURCE_GROUP: ${{ vars.NONPROD_STATE_RESOURCE_GROUP }}
  NONPROD_RESOURCE_GROUP: ${{ vars.NONPROD_RESOURCE_GROUP }}
  NONPROD_TFVARS_JSON: ${{ vars.NONPROD_TFVARS_JSON }}

  DEPLOYMENT_SCOPE: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.NONPROD_RESOURCE_GROUP }}

jobs:
  # Existing application state may still own the legacy purge-protected vault.
  # Reconcile the same trust boundary before planning a destructive teardown.
  destroy-recovery:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DESTROY_NONPROD'
    environment: nonprod-recovery
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce GitHub recovery environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/nonprod-recovery" \
            | jq -e '
                (.deployment_branch_policy.protected_branches == true)
                and (any(.protection_rules[]?; .type == "required_reviewers"))
              ' >/dev/null || {
                echo "::error::nonprod-recovery requires protected branches and human reviewers."
                exit 1
              }
      - name: Verify separate OIDC recovery configuration
        env:
          RECOVERY_CLIENT_ID: ${{ vars.AZURE_NONPROD_RECOVERY_CLIENT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$RECOVERY_CLIENT_ID" ]] || {
            echo "::error::Protected NONPROD recovery identity is not configured."
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_NONPROD_RECOVERY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify or recover persistent bootstrap vault
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          mkdir -p infra/terraform/nonprod
          printf '%s' "$NONPROD_TFVARS_JSON" > infra/terraform/nonprod/nonprod.auto.tfvars.json
          cd infra/terraform/nonprod
          python -m tirodhan.deployment.foundation_reconcile recover-vault

  destroy-state-reconcile:
    needs: destroy-recovery
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DESTROY_NONPROD'
    environment:
      name: nonprod-plan
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nonprod-setup
      - name: Snapshot and release verified legacy vault state
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail
          python -m tirodhan.deployment.foundation_reconcile release-legacy-state

  destroy-plan:
    needs: destroy-state-reconcile
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DESTROY_NONPROD'
    environment:
      name: nonprod-plan
      deployment: false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nonprod-setup

      - name: Configure destroy-only Key Vault behaviour
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("infra/terraform/nonprod/providers.tf")
          text = path.read_text(encoding="utf-8")

          old = """  features {}"""
          new = """  features {
              key_vault {
                purge_soft_delete_on_destroy = false
              }
            }"""

          if old not in text:
              raise SystemExit(
                  "Expected AzureRM features block not found; refusing destroy."
              )

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          cd infra/terraform/nonprod
          terraform validate

      - name: Guard current NONPROD configuration
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          if [[ "$STATE_RESOURCE_GROUP" == "$NONPROD_RESOURCE_GROUP" ]]; then
            echo "State RG must not equal application RG." >&2
            exit 1
          fi

          configured_subscription="$(jq -r '.subscription_id' nonprod.auto.tfvars.json)"
          configured_rg="$(jq -r '.resource_group_name' nonprod.auto.tfvars.json)"
          configured_suffix="$(jq -r '.suffix' nonprod.auto.tfvars.json)"

          if [[ "$configured_subscription" != "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "Terraform input subscription does not match the authenticated subscription." >&2
            exit 1
          fi

          if [[ "$configured_rg" != "$NONPROD_RESOURCE_GROUP" ]]; then
            echo "Terraform input resource group does not match NONPROD_RESOURCE_GROUP." >&2
            exit 1
          fi

          if [[ "$configured_suffix" != "${{ inputs.expected_suffix }}" ]]; then
            echo "Expected suffix does not match NONPROD Terraform input." >&2
            exit 1
          fi

          echo "Destroy configuration boundary checks passed."

      - name: Create guarded destroy plan
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          terraform plan \
            -destroy \
            -input=false \
            -out=destroy.tfplan

          terraform show -json destroy.tfplan \
            | python -m tirodhan.deployment.check_destroy_plan \
                --expected-subscription-id "$ARM_SUBSCRIPTION_ID" \
                --expected-resource-group "$NONPROD_RESOURCE_GROUP" \
                --protected-state-account "$STATE_ACCOUNT_NAME" \
                --protected-state-container tfstate \
                --allow-empty

          # Empty teardown plans are accepted only after verifying the actual
          # Azure disposable inventory and remote managed state are both empty.
          delete_count="$(terraform show -json destroy.tfplan \
            | jq '[.resource_changes[]? | select(.change.actions == ["delete"])] | length')"
          if [[ "$delete_count" == "0" ]]; then
            python -m tirodhan.deployment.foundation_lifecycle verify-clean
          fi
          terraform show -json destroy.tfplan \
            | python -m tirodhan.deployment.check_state

      - uses: actions/upload-artifact@v4
        with:
          name: nonprod-destroy-plan
          path: infra/terraform/nonprod/destroy.tfplan
          retention-days: 1

  destroy-apply:
    needs: destroy-plan
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DESTROY_NONPROD'
    environment: nonprod
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nonprod-setup

      - name: Configure destroy-only Key Vault behaviour
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("infra/terraform/nonprod/providers.tf")
          text = path.read_text(encoding="utf-8")

          old = """  features {}"""
          new = """  features {
              key_vault {
                purge_soft_delete_on_destroy = false
              }
            }"""

          if old not in text:
              raise SystemExit(
                  "Expected AzureRM features block not found; refusing destroy."
              )

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          cd infra/terraform/nonprod
          terraform validate

      - uses: actions/download-artifact@v4
        with:
          name: nonprod-destroy-plan
          path: infra/terraform/nonprod

      - name: Revalidate saved destroy plan
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          configured_subscription="$(jq -r '.subscription_id' nonprod.auto.tfvars.json)"
          configured_rg="$(jq -r '.resource_group_name' nonprod.auto.tfvars.json)"
          configured_suffix="$(jq -r '.suffix' nonprod.auto.tfvars.json)"

          if [[ "$configured_subscription" != "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "Terraform input subscription changed after planning; refusing apply." >&2
            exit 1
          fi

          if [[ "$configured_rg" != "$NONPROD_RESOURCE_GROUP" ]]; then
            echo "Terraform input resource group changed after planning; refusing apply." >&2
            exit 1
          fi

          if [[ "$configured_suffix" != "${{ inputs.expected_suffix }}" ]]; then
            echo "NONPROD suffix changed after planning; refusing apply." >&2
            exit 1
          fi

          terraform show -json destroy.tfplan \
            | python -m tirodhan.deployment.check_destroy_plan \
                --expected-subscription-id "$ARM_SUBSCRIPTION_ID" \
                --expected-resource-group "$NONPROD_RESOURCE_GROUP" \
                --protected-state-account "$STATE_ACCOUNT_NAME" \
                --protected-state-container tfstate \
                --allow-empty

      - name: Apply approved destroy plan
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          terraform apply \
            -input=false \
            destroy.tfplan

      - name: Verify disposable Azure resources are removed
        working-directory: infra/terraform/nonprod
        run: python -m tirodhan.deployment.foundation_lifecycle verify-clean

      - name: Verify Terraform application state is empty
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          # Read-only bootstrap data sources may remain; no managed resources may.
          remaining="$(terraform state list | grep -v '^data\.' || true)"

          if [[ -n "$remaining" ]]; then
            echo "Terraform-managed resources remain after destroy:" >&2
            echo "$remaining" >&2
            exit 1
          fi

          echo "Terraform-managed NONPROD application state is empty."

      - name: Verify preserved bootstrap resources
        run: |
          set -euo pipefail

          az group show \
            --name "$NONPROD_RESOURCE_GROUP" \
            --output none

          az group show \
            --name "$STATE_RESOURCE_GROUP" \
            --output none

          az storage account show \
            --resource-group "$STATE_RESOURCE_GROUP" \
            --name "$STATE_ACCOUNT_NAME" \
            --output none

          az storage container show \
            --account-name "$STATE_ACCOUNT_NAME" \
            --name tfstate \
            --auth-mode login \
            --output none

          echo "Preserved application RG: $NONPROD_RESOURCE_GROUP"
          echo "Preserved Terraform state RG: $STATE_RESOURCE_GROUP"
          echo "Preserved Terraform state account: $STATE_ACCOUNT_NAME"
          echo "Preserved Terraform state container: tfstate"
          # The purge-protected Key Vault is bootstrap-owned and intentionally retained.
          az keyvault show --name "td-np-${{ inputs.expected_suffix }}-kv" \
            --resource-group "$NONPROD_RESOURCE_GROUP" --output none
          echo "NONPROD disposable resources destroyed; bootstrap resources preserved."
