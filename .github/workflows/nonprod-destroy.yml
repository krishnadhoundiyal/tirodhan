name: Destroy NONPROD

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY_NONPROD exactly
        required: true
        type: string
      expected_suffix:
        description: NONPROD suffix expected in the current Terraform input
        required: true
        default: tdnp01
        type: string

permissions:
  contents: read

concurrency:
  group: nonprod-release
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'

  STATE_ACCOUNT_NAME: ${{ vars.NONPROD_STATE_ACCOUNT }}
  STATE_RESOURCE_GROUP: ${{ vars.NONPROD_STATE_RESOURCE_GROUP }}
  NONPROD_RESOURCE_GROUP: ${{ vars.NONPROD_RESOURCE_GROUP }}
  NONPROD_TFVARS_JSON: ${{ vars.NONPROD_TFVARS_JSON }}

  DEPLOYMENT_SCOPE: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.NONPROD_RESOURCE_GROUP }}

jobs:
  destroy-plan:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DESTROY_NONPROD'
    environment:
      name: nonprod-plan
      deployment: false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nonprod-setup

      - name: Configure destroy-only Key Vault behaviour
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("infra/terraform/nonprod/providers.tf")
          text = path.read_text(encoding="utf-8")

          old = """  features {}"""
          new = """  features {
              key_vault {
                purge_soft_delete_on_destroy = false
              }
            }"""

          if old not in text:
              raise SystemExit(
                  "Expected AzureRM features block not found; refusing destroy."
              )

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          cd infra/terraform/nonprod
          terraform validate

      - name: Guard current NONPROD configuration
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          if [[ "$STATE_RESOURCE_GROUP" == "$NONPROD_RESOURCE_GROUP" ]]; then
            echo "State RG must not equal application RG." >&2
            exit 1
          fi

          configured_subscription="$(jq -r '.subscription_id' nonprod.auto.tfvars.json)"
          configured_rg="$(jq -r '.resource_group_name' nonprod.auto.tfvars.json)"
          configured_suffix="$(jq -r '.suffix' nonprod.auto.tfvars.json)"

          if [[ "$configured_subscription" != "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "Terraform input subscription does not match the authenticated subscription." >&2
            exit 1
          fi

          if [[ "$configured_rg" != "$NONPROD_RESOURCE_GROUP" ]]; then
            echo "Terraform input resource group does not match NONPROD_RESOURCE_GROUP." >&2
            exit 1
          fi

          if [[ "$configured_suffix" != "${{ inputs.expected_suffix }}" ]]; then
            echo "Expected suffix does not match NONPROD Terraform input." >&2
            exit 1
          fi

          echo "Destroy configuration boundary checks passed."

      - name: Create guarded destroy plan
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          terraform plan \
            -destroy \
            -input=false \
            -out=destroy.tfplan

          terraform show -json destroy.tfplan \
            | python -m tirodhan.deployment.check_destroy_plan \
                --expected-subscription-id "$ARM_SUBSCRIPTION_ID" \
                --expected-resource-group "$NONPROD_RESOURCE_GROUP" \
                --protected-state-account "$STATE_ACCOUNT_NAME" \
                --protected-state-container tfstate \
                --allow-empty

          terraform show -json destroy.tfplan \
            | python -m tirodhan.deployment.check_state

      - uses: actions/upload-artifact@v4
        with:
          name: nonprod-destroy-plan
          path: infra/terraform/nonprod/destroy.tfplan
          retention-days: 1

  destroy-apply:
    needs: destroy-plan
    timeout-minutes: 90
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DESTROY_NONPROD'
    environment: nonprod
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/nonprod-setup

      - name: Configure destroy-only Key Vault behaviour
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("infra/terraform/nonprod/providers.tf")
          text = path.read_text(encoding="utf-8")

          old = """  features {}"""
          new = """  features {
              key_vault {
                purge_soft_delete_on_destroy = false
              }
            }"""

          if old not in text:
              raise SystemExit(
                  "Expected AzureRM features block not found; refusing destroy."
              )

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          cd infra/terraform/nonprod
          terraform validate

      - uses: actions/download-artifact@v4
        with:
          name: nonprod-destroy-plan
          path: infra/terraform/nonprod

      - name: Revalidate saved destroy plan
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          configured_subscription="$(jq -r '.subscription_id' nonprod.auto.tfvars.json)"
          configured_rg="$(jq -r '.resource_group_name' nonprod.auto.tfvars.json)"
          configured_suffix="$(jq -r '.suffix' nonprod.auto.tfvars.json)"

          if [[ "$configured_subscription" != "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "Terraform input subscription changed after planning; refusing apply." >&2
            exit 1
          fi

          if [[ "$configured_rg" != "$NONPROD_RESOURCE_GROUP" ]]; then
            echo "Terraform input resource group changed after planning; refusing apply." >&2
            exit 1
          fi

          if [[ "$configured_suffix" != "${{ inputs.expected_suffix }}" ]]; then
            echo "NONPROD suffix changed after planning; refusing apply." >&2
            exit 1
          fi

          terraform show -json destroy.tfplan \
            | python -m tirodhan.deployment.check_destroy_plan \
                --expected-subscription-id "$ARM_SUBSCRIPTION_ID" \
                --expected-resource-group "$NONPROD_RESOURCE_GROUP" \
                --protected-state-account "$STATE_ACCOUNT_NAME" \
                --protected-state-container tfstate \
                --allow-empty

      - name: Apply approved destroy plan
        id: destroy_apply
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          apply_log="$(mktemp "$RUNNER_TEMP/nonprod-destroy-apply.XXXXXX")"
          trap 'rm -f "$apply_log"' EXIT

          set +e
          terraform apply -input=false destroy.tfplan 2>&1 | tee "$apply_log"
          apply_status=$?
          set -e

          if (( apply_status == 0 )); then
            echo "reconcile=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # AzureRM can fail while polling a successful Managed Environment
          # deletion if Azure returns an empty response Content-Type. This is
          # a possible success, never proof of success.
          error_count="$(grep -c 'Error:' "$apply_log" || true)"
          if [[ "$error_count" == "1" ]] \
             && grep -Fq 'polling support for the Content-Type "" was not implemented' "$apply_log" \
             && grep -Fq 'deleting Managed Environment' "$apply_log" \
             && grep -Fq "Managed Environment Name: \"$NONPROD_RESOURCE_GROUP-aca\"" "$apply_log"
          then
            echo "::warning::AzureRM Managed Environment deletion polling failed; actual deletion must be verified."
            echo "reconcile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unexpected Terraform apply error; refusing recovery." >&2
          exit "$apply_status"

      - name: Complete and verify approved ACA environment deletion
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          # The original saved plan is the authorization boundary, not a guessed name
          # or an empty resource-group inventory. Run after both normal apply success
          # and the recognized poller error. This must complete before reconciliation.
          terraform show -json destroy.tfplan \
            | python -m tirodhan.deployment.destroy_aca_environment \
                --expected-subscription-id "$ARM_SUBSCRIPTION_ID" \
                --expected-resource-group "$NONPROD_RESOURCE_GROUP" \
                --protected-state-account "$STATE_ACCOUNT_NAME" \
                --protected-state-container tfstate \
                --timeout-seconds 1800 \
                --poll-seconds 10 \
                --max-delete-attempts 3

      - name: Verify and reconcile only an empty post-failure destroy
        if: steps.destroy_apply.outputs.reconcile == 'true'
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          # Resource-specific GET already proved the approved environment absent.
          # This broader inventory is an additional all-resources check; it cannot
          # substitute for driving/confirming environment deletion in the prior step.
          empty_observations=0
          remaining_azure_resources=""
          for attempt in {1..18}; do
            remaining_azure_resources="$(az resource list \
              --resource-group "$NONPROD_RESOURCE_GROUP" \
              --query "[].id" \
              --output tsv)"
            if [[ -z "$remaining_azure_resources" ]]; then
              empty_observations=$((empty_observations + 1))
              if (( empty_observations >= 2 )); then
                break
              fi
            else
              empty_observations=0
            fi
            sleep 10
          done

          if (( empty_observations < 2 )); then
            echo "Azure application resources remain after the polling error:" >&2
            echo "$remaining_azure_resources" >&2
            echo "Rerun the protected destroy workflow after Azure converges." >&2
            exit 1
          fi

          # This is NOT another destroy attempt. Terraform first refreshes the
          # remote state; it must now propose absolutely zero further deletes.
          # Applying this empty saved plan records refreshed state under the
          # normal backend lock without touching Azure resources.
          terraform plan -destroy -input=false -out=terminal-convergence.tfplan
          terraform show -json terminal-convergence.tfplan \
            | python -m tirodhan.deployment.check_destroy_plan \
                --expected-subscription-id "$ARM_SUBSCRIPTION_ID" \
                --expected-resource-group "$NONPROD_RESOURCE_GROUP" \
                --protected-state-account "$STATE_ACCOUNT_NAME" \
                --protected-state-container tfstate \
                --require-empty

          terraform apply -input=false terminal-convergence.tfplan
          echo "AzureRM polling error reconciled with an approved zero-delete plan."

      - name: Verify Terraform application state is empty
        working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail

          remaining="$(terraform state list)"

          if [[ -n "$remaining" ]]; then
            echo "Terraform-managed resources remain after destroy:" >&2
            echo "$remaining" >&2
            exit 1
          fi

          echo "Terraform-managed NONPROD application state is empty."

      - name: Verify preserved bootstrap resources
        run: |
          set -euo pipefail

          az group show \
            --name "$NONPROD_RESOURCE_GROUP" \
            --output none

          az group show \
            --name "$STATE_RESOURCE_GROUP" \
            --output none

          az storage account show \
            --resource-group "$STATE_RESOURCE_GROUP" \
            --name "$STATE_ACCOUNT_NAME" \
            --output none

          az storage container show \
            --account-name "$STATE_ACCOUNT_NAME" \
            --name tfstate \
            --auth-mode login \
            --output none

          remaining_azure_resources="$(az resource list \
            --resource-group "$NONPROD_RESOURCE_GROUP" \
            --query "[].id" \
            --output tsv)"

          if [[ -n "$remaining_azure_resources" ]]; then
            echo "Active Azure resources remain in the NONPROD application RG:" >&2
            echo "$remaining_azure_resources" >&2
            exit 1
          fi

          # The OIDC client ID is an app ID, not the role-assignment object ID.
          # Read the object ID from Azure CLI's token for this logged-in identity,
          # validating both the configured client and tenant without Graph access.
          deployment_principal_id="$(az account get-access-token \
            --resource https://management.azure.com/ \
            --query accessToken \
            --output tsv \
            | python -m tirodhan.deployment.check_nonprod_bootstrap_rbac principal \
                --client-id "$ARM_CLIENT_ID" \
                --tenant-id "$ARM_TENANT_ID")"

          az role assignment list \
            --resource-group "$NONPROD_RESOURCE_GROUP" \
            --fill-principal-name false \
            --output json \
            | python -m tirodhan.deployment.check_nonprod_bootstrap_rbac verify \
                --expected-scope "$DEPLOYMENT_SCOPE" \
                --expected-principal-id "$deployment_principal_id" \
                --expected-suffix "${{ inputs.expected_suffix }}"

          echo "Preserved application RG: $NONPROD_RESOURCE_GROUP"
          echo "Preserved Terraform state RG: $STATE_RESOURCE_GROUP"
          echo "Preserved Terraform state account: $STATE_ACCOUNT_NAME"
          echo "Preserved Terraform state container: tfstate"
          echo "NONPROD Terraform-managed application resources are destroyed."
