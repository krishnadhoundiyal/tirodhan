name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tirodhan
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: tirodhan_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      TIRODHAN_TEST_DATABASE_URL: postgresql+asyncpg://tirodhan:disposable-test-only@localhost:5432/tirodhan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - run: |
          docker build -f deploy/fluent-bit/Dockerfile -t tirodhan-log-sidecar:pr .
          docker run --rm --entrypoint python3 \
            -v "$PWD/tests/deployment:/verification:ro" \
            -v "$PWD/deploy/fluent-bit:/source:ro" \
            tirodhan-log-sidecar:pr /verification/fluent_bit_probe.py
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - working-directory: infra/terraform/nonprod
        run: terraform init -backend=false -input=false -lockfile=readonly && terraform validate
      # No OIDC on PR code, including same-repository PRs. Cloud plans are produced
      # on protected main using nonprod-plan in the deployment workflow.
