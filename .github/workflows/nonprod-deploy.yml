name: NONPROD staged deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nonprod-release
  cancel-in-progress: false
env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'
  STATE_ACCOUNT_NAME: ${{ vars.NONPROD_STATE_ACCOUNT }}
  STATE_RESOURCE_GROUP: ${{ vars.NONPROD_STATE_RESOURCE_GROUP }}
  NONPROD_TFVARS_JSON: ${{ vars.NONPROD_TFVARS_JSON }}
  DEPLOYMENT_SCOPE: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.NONPROD_RESOURCE_GROUP }}
  APPLICATION_IMAGE: ghcr.io/krishnadhoundiyal/tirodhan:${{ github.sha }}
  FLUENT_BIT_IMAGE: ghcr.io/krishnadhoundiyal/tirodhan-log-sidecar:${{ github.sha }}
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tirodhan
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: tirodhan_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U tirodhan' --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check . && mypy && pytest -q
        env:
          TIRODHAN_TEST_DATABASE_URL: postgresql+asyncpg://tirodhan:disposable-test-only@localhost:5432/tirodhan_test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.APPLICATION_IMAGE }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          file: deploy/fluent-bit/Dockerfile
          tags: ${{ env.FLUENT_BIT_IMAGE }}
      - run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD/tests/deployment:/verification:ro" \
            -v "$PWD/deploy/fluent-bit:/source:ro" \
            "$FLUENT_BIT_IMAGE" /verification/fluent_bit_probe.py
  migration-plan:
    needs: build
    environment: nonprod-plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nonprod-setup
      - working-directory: infra/terraform/nonprod
        run: python -m tirodhan.deployment.release migration-plan --plan migration.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: migration-plan
          path: infra/terraform/nonprod/migration.tfplan
          retention-days: 1
  migration-apply:
    needs: migration-plan
    environment: nonprod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nonprod-setup
      - uses: actions/download-artifact@v4
        with:
          name: migration-plan
          path: infra/terraform/nonprod
      - working-directory: infra/terraform/nonprod
        run: |
          terraform apply -input=false migration.tfplan
          terraform show -json | python -m tirodhan.deployment.check_state
          python -m tirodhan.deployment.release migrate
  runtime-plan:
    needs: migration-apply
    environment: nonprod-plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nonprod-setup
      - working-directory: infra/terraform/nonprod
        run: python -m tirodhan.deployment.release runtime-plan --plan runtime.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-plan
          path: infra/terraform/nonprod/runtime.tfplan
          retention-days: 1
  runtime-apply:
    needs: runtime-plan
    environment: nonprod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nonprod-setup
      - uses: actions/download-artifact@v4
        with:
          name: runtime-plan
          path: infra/terraform/nonprod
      - working-directory: infra/terraform/nonprod
        run: |
          set -euo pipefail
          terraform apply -input=false runtime.tfplan
          terraform show -json | python -m tirodhan.deployment.check_state
          url="$(terraform output -raw api_url)"
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 "$url/health"
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 "$url/ready"
