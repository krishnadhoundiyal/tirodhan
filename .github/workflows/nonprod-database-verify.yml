name: NONPROD protected database verification
run-name: SQL verification ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        type: string
        required: true
      authorization_id:
        type: string
        required: true
      request:
        description: Nonsecret exact consumer context, generated by the trusted deployment job
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: nonprod-database-${{ inputs.request_id }}
  cancel-in-progress: false
env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  NONPROD_RESOURCE_GROUP: ${{ vars.NONPROD_RESOURCE_GROUP }}
  STATE_ACCOUNT_NAME: ${{ vars.NONPROD_STATE_ACCOUNT }}
  STATE_RESOURCE_GROUP: ${{ vars.NONPROD_STATE_RESOURCE_GROUP }}
  NONPROD_TFVARS_JSON: ${{ vars.NONPROD_TFVARS_JSON }}
  AZURE_NONPROD_RECOVERY_CLIENT_ID: ${{ vars.AZURE_NONPROD_RECOVERY_CLIENT_ID }}
  AZURE_NONPROD_RECOVERY_PRINCIPAL_ID: ${{ vars.AZURE_NONPROD_RECOVERY_PRINCIPAL_ID }}
  AZURE_NONPROD_DATABASE_VERIFY_CLIENT_ID: ${{ vars.AZURE_NONPROD_DATABASE_VERIFY_CLIENT_ID }}
  AZURE_NONPROD_DATABASE_VERIFY_PRINCIPAL_ID: ${{ vars.AZURE_NONPROD_DATABASE_VERIFY_PRINCIPAL_ID }}
  DEPLOYMENT_SCOPE: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.NONPROD_RESOURCE_GROUP }}
  TIRODHAN_OPERATOR_RUN_ID: ${{ inputs.authorization_id }}
  TIRODHAN_EXECUTION_ENVIRONMENT: nonprod-database
  DATABASE_VERIFICATION_REQUEST: ${{ inputs.request }}
  DATABASE_VERIFICATION_REQUEST_ID: ${{ inputs.request_id }}
  GH_TOKEN: ${{ github.token }}
jobs:
  release-admission:
    env:
      TIRODHAN_NONPROD_RELEASE_AUTHORIZATION: ${{ secrets.NONPROD_DATABASE_VERIFY_AUTHORIZATION }}
    if: github.ref == 'refs/heads/main'
    environment: nonprod-database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authorize exact request before Azure authentication
        run: |
          python -m pip install -e .
          python -m tirodhan.deployment.database_verifier authorize
  verify:
    env:
      TIRODHAN_NONPROD_RELEASE_AUTHORIZATION: ${{ secrets.NONPROD_DATABASE_VERIFY_AUTHORIZATION }}
    needs: release-admission
    if: github.ref == 'refs/heads/main'
    environment: nonprod-database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck authorization and active consumer after approval
        run: |
          python -m pip install -e .
          python -m tirodhan.deployment.database_verifier authorize
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_NONPROD_DATABASE_VERIFY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Observe SQL facts and sign only the bound report
        env:
          TIRODHAN_DATABASE_EVIDENCE_KEY_ID: ${{ vars.NONPROD_DATABASE_EVIDENCE_KEY_ID }}
          DATABASE_EVIDENCE_PRIVATE_KEY_PEM: ${{ secrets.NONPROD_DATABASE_EVIDENCE_PRIVATE_KEY_PEM }}
        run: python -m tirodhan.deployment.database_verifier verify
      - uses: actions/upload-artifact@v4
        with:
          name: database-evidence-${{ inputs.request_id }}
          path: ${{ runner.temp }}/database-evidence.jwt
          if-no-files-found: error
          retention-days: 1
