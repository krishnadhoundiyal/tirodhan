name: Rotate NONPROD log user-delegation SAS
on:
  schedule:
    - cron: '23 4 */3 * *'
  workflow_dispatch:
    inputs:
      authorization_id:
        description: Explicit signed release session ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nonprod-release
  cancel-in-progress: false
env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  NONPROD_RESOURCE_GROUP: ${{ vars.NONPROD_RESOURCE_GROUP }}
  STATE_ACCOUNT_NAME: ${{ vars.NONPROD_STATE_ACCOUNT }}
  STATE_RESOURCE_GROUP: ${{ vars.NONPROD_STATE_RESOURCE_GROUP }}
  NONPROD_TFVARS_JSON: ${{ vars.NONPROD_TFVARS_JSON }}
  AZURE_NONPROD_RECOVERY_CLIENT_ID: ${{ vars.AZURE_NONPROD_RECOVERY_CLIENT_ID }}
  AZURE_NONPROD_DATABASE_VERIFY_CLIENT_ID: ${{ vars.AZURE_NONPROD_DATABASE_VERIFY_CLIENT_ID }}
  AZURE_NONPROD_DATABASE_VERIFY_PRINCIPAL_ID: ${{ vars.AZURE_NONPROD_DATABASE_VERIFY_PRINCIPAL_ID }}
  TIRODHAN_OPERATOR_RUN_ID: ${{ inputs.authorization_id || vars.NONPROD_LOG_SAS_AUTHORIZATION_ID }}
  TIRODHAN_NONPROD_RELEASE_AUTHORIZATION: ${{ github.event_name == 'schedule' && secrets.NONPROD_LOG_SAS_AUTHORIZATION || secrets.NONPROD_RELEASE_AUTHORIZATION }}
  TIRODHAN_SCHEDULE: ${{ github.event.schedule }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release-admission:
    env:
      TIRODHAN_NONPROD_OPERATION: rotate-log-sas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce integration deployment hold before Azure authentication
        run: |
          python -m pip install -e .
          python -m tirodhan.deployment.deployment_admission
  rotate:
    permissions:
      contents: read
      actions: read
      id-token: write
    needs: release-admission
    if: github.ref == 'refs/heads/main'
    environment: nonprod-plan
    runs-on: ubuntu-latest
    env:
      TIRODHAN_EXECUTION_ENVIRONMENT: nonprod-plan
      DEPLOYMENT_SCOPE: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.NONPROD_RESOURCE_GROUP }}
      LOG_ACCOUNT_NAME: ${{ vars.NONPROD_LOG_ACCOUNT_NAME }}
      KEY_VAULT_URL: ${{ vars.NONPROD_KEY_VAULT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python -m pip install -e .
      - run: python -m tirodhan.deployment.azure_controls
      - run: python -m tirodhan.deployment.rotate_log_sas
