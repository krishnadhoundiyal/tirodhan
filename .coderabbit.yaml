# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: "Be concise. Prioritize functional correctness, architecture, security, concurrency, idempotency, data integrity, and operational failure modes over style-only comments."

chat:
  auto_reply: true

reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  review_details: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"

  path_instructions:
    - path: "src/**"
      instructions: |
        Functionality is the first priority.
        Treat AGENTS.md and the relevant documents under docs as architectural authority.
        Verify domain invariants, state transitions, authorization, idempotency, concurrency, retries, transaction boundaries, external side effects, and failure recovery.
        Flag architecture drift, invented APIs or contracts, silent weakening of invariants, read-then-write races, duplicate business effects, and code paths that can lose accepted work.
        Prefer concrete defects with an execution path over stylistic observations.

    - path: "tests/**"
      instructions: |
        Review whether tests prove behavior and business invariants rather than mirroring implementation.
        Look for missing replay, duplicate delivery, concurrency, crash-and-retry, external side-effect, authorization, and negative-path coverage where applicable.
        Flag tests that pass while the corresponding business effect could still be duplicated, lost, or partially committed.

    - path: "infra/terraform/**"
      instructions: |
        Review desired-state correctness, retry safety, dependency ordering, least privilege, state ownership, destructive boundaries, and recovery from partial Azure operations.
        Flag any possibility of deleting bootstrap or Terraform backend resources, introducing raw storage keys or long-lived credentials, or producing a deployment that can silently stop in an unsafe partial state.
        Preserve the documented Azure Container Apps, PostgreSQL, Service Bus, Blob, Key Vault, managed identity, and Terraform architecture unless an approved ADR changes it.

    - path: ".github/workflows/**"
      instructions: |
        Treat deployment workflows as production code.
        Verify OIDC and environment gates, idempotent reruns, partial-failure recovery, immutable plan/apply boundaries, protected-resource checks, and that successful CI claims match what was actually executed.
        Flag workflows that can mutate Azure before prerequisites are proven or that weaken manual approval for protected deployment actions.

    - path: "**/versions/*.py"
      instructions: |
        Review migrations for safe forward execution, constraints, indexes, backfill behavior, lock and table-scan risk, rollback assumptions, and compatibility with existing application code.
        Flag schema changes that can corrupt historical facts or bypass documented domain constraints.

knowledge_base:
  linked_repositories:
    - repository: "krishnadhoundiyal/tirodhan-frontend"
      instructions: "Frontend monorepo. Check backend API, auth, domain, and contract changes against frontend consumers and flag cross-repository incompatibilities or assumptions not supported by the backend."
